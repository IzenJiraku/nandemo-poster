<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0c">
<title>なんでもポスター</title>
<meta name="description" content="写真を入れるだけで、映画のポスターになる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Dela+Gothic+One&family=DotGothic16&family=Gowun+Batang&family=Hina+Mincho&family=Kaisei+Decol:wght@700&family=Klee+One:wght@600&family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Sans+KR:wght@700;900&family=Noto+Serif+JP:wght@300;500;700;900&family=Noto+Serif+TC:wght@600&family=Orbitron:wght@700&family=RocknRoll+One&family=Shippori+Mincho+B1:wght@600;800&family=Yuji+Boku&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@700&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="start">

<header class="bar">
  <span class="logo">なんでもポスター</span>
  <div class="bar-right">
    <label class="link studio-only">
      <input type="file" accept="image/*">
      <span>写真を変える</span>
    </label>
    <button id="open-basket" type="button" class="basket-link" aria-label="カゴを見る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l-1.4 10.2a1.5 1.5 0 0 1-1.5 1.3H7.9a1.5 1.5 0 0 1-1.5-1.3L5 9Z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg>
      <span>カゴ</span><span id="basket-count" class="count">0</span>
    </button>
  </div>
</header>

<!-- はじめの画面：写真を選ぶだけ -->
<main class="start start-only">
  <p class="eyebrow">NANDEMO POSTER</p>
  <h1>その一枚を、<br>映画にする。</h1>
  <label class="pick">
    <input id="photo" type="file" accept="image/*">
    <span>写真をえらぶ</span>
  </label>
  <p class="fine">ドラッグ＆ドロップでもOK。<br>写真は端末の外に送信されません。</p>
</main>

<!-- ポスターの画面 -->
<main class="studio studio-only">
  <div class="stage">
    <div class="poster-wrap">
      <canvas id="poster" aria-label="ポスター。ドラッグで写真の位置を動かせます"></canvas>
      <button id="keep" type="button" class="keep" aria-label="カゴに入れる" title="カゴに入れる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l-1.4 10.2a1.5 1.5 0 0 1-1.5 1.3H7.9a1.5 1.5 0 0 1-1.5-1.3L5 9Z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/><path d="M12 12.5v4.5M9.75 14.75h4.5"/></svg>
      </button>
      <div class="developing" aria-hidden="true"><span>現像中</span></div>
    </div>
  </div>

  <p class="now"><span id="layout-now"></span></p>
  <nav id="genres" class="genres" aria-label="ジャンル"></nav>

  <div class="actions">
    <button id="undo" type="button" class="act" aria-label="ひとつ戻る" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h9a5 5 0 0 1 0 10h-2"/></svg>
      <span>戻る</span>
    </button>
    <button id="layout-roll" type="button" class="act" aria-label="構図を変える">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M4 15h16M8 18h8"/></svg>
      <span>構図</span>
    </button>
    <button id="shuffle" type="button" class="act main" aria-label="ジャンル・構図・文字をまとめて変える">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3"/><circle cx="15.5" cy="15.5" r="1.3"/><circle cx="15.5" cy="8.5" r="1.3"/><circle cx="8.5" cy="15.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/></svg>
      <span>おまかせ</span>
    </button>
    <button id="open-edit" type="button" class="act" aria-label="文字と細かい設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
      <span>文字</span>
    </button>
    <button id="save" type="button" class="act" aria-label="画像を保存">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>
      <span>保存</span>
    </button>
  </div>
</main>

<!-- 文字と細かい設定（開いたままポスターが見える） -->
<dialog id="sheet" class="sheet">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2>クレジット</h2>
      <button id="close-edit" type="button" class="close">完了</button>
    </div>

    <div class="field"><label for="f-title">タイトル</label><input id="f-title" autocomplete="off"><button type="button" data-roll="title" aria-label="タイトルを別の案にする" title="別の案にする">↻</button></div>
    <div class="field"><label for="f-en">サブ</label><input id="f-en" autocomplete="off"><button type="button" data-roll="en" aria-label="サブタイトルを別の案にする" title="別の案にする">↻</button></div>
    <div class="field"><label for="f-tagline">コピー</label><input id="f-tagline" autocomplete="off"><button type="button" data-roll="tagline" aria-label="コピーを別の案にする" title="別の案にする">↻</button></div>
    <div class="field"><label for="f-cast">キャスト</label><input id="f-cast" placeholder="読点で区切る" autocomplete="off"><button type="button" data-roll="cast" aria-label="キャストを別の案にする" title="別の案にする">↻</button></div>
    <div class="field"><label for="f-director">監督</label><input id="f-director" autocomplete="off"><button type="button" data-roll="director" aria-label="監督を別の案にする" title="別の案にする">↻</button></div>
    <div class="field"><label for="f-date">公開日</label><input id="f-date" autocomplete="off"><button type="button" data-roll="date" aria-label="公開日を別の案にする" title="別の案にする">↻</button></div>
    <p id="mine-note" class="fine mine-note" hidden>● のついた項目は、ジャンルを変えてもそのまま残ります。</p>
    <button id="text-random" type="button" class="text-btn">文字だけ入れ替える</button>

    <h2>デザイン</h2>
    <label class="sel"><span>構図</span><select id="layout"></select></label>
    <label class="sel"><span>タイトル書体</span><select id="title-font"></select></label>
    <label class="sel"><span>色調</span><select id="grade"></select></label>

    <h2>写真の位置</h2>
    <p class="fine tight">ポスターを直接ドラッグしても動かせます。</p>
    <label class="range">左右<input id="focusX" type="range" min="0" max="100" value="50"></label>
    <label class="range">上下<input id="focusY" type="range" min="0" max="100" value="50"></label>

    <p class="fine">人名・映画祭名・媒体名はすべて架空です。</p>
  </div>
</dialog>

<!-- カゴ -->
<dialog id="basket" class="basket">
  <div class="basket-in">
    <div class="sheet-head">
      <h2>カゴ</h2>
      <button id="close-basket" type="button" class="close">閉じる</button>
    </div>
    <p class="fine tight">この端末のブラウザの中にだけ保存されます。</p>
    <p id="basket-empty" class="empty">まだ何もありません。<br>ポスター右上の <b>＋</b> でカゴに入れられます。</p>
    <div id="basket-grid" class="basket-grid"></div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div class="drop-veil" aria-hidden="true"><span>ここに写真をドロップ</span></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="layouts.js"></script>
<script src="styles.js"></script>
<script src="app.js"></script>
</body>
</html>
