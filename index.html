<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0c">
<title>なんでもポスター</title>
<meta name="description" content="写真を入れるだけで、映画のポスターになる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Dela+Gothic+One&family=Gowun+Batang&family=Noto+Sans+KR:wght@700;900&family=Yuji+Boku&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@300;500;900&family=Orbitron:wght@700&family=Shippori+Mincho+B1:wght@600;800&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="start">

<header class="bar">
  <span class="logo">なんでもポスター</span>
  <label class="link studio-only">
    <input type="file" accept="image/*">
    <span>写真を変える</span>
  </label>
</header>

<!-- はじめの画面：写真を選ぶだけ -->
<main class="start start-only">
  <p class="eyebrow">NANDEMO POSTER</p>
  <h1>その一枚を、<br>映画にする。</h1>
  <label class="pick">
    <input id="photo" type="file" accept="image/*">
    <span>写真をえらぶ</span>
  </label>
  <p class="fine">ドラッグ＆ドロップでもOK。<br>写真は端末の外に送信されません。</p>
</main>

<!-- ポスターの画面 -->
<main class="studio studio-only">
  <div class="stage">
    <canvas id="poster" aria-label="ポスター"></canvas>
  </div>

  <nav id="genres" class="genres" aria-label="ジャンル"></nav>

  <div class="actions">
    <button id="shuffle" type="button" class="act main" aria-label="ジャンル・構図・文字をまとめて変える">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3"/><circle cx="15.5" cy="15.5" r="1.3"/><circle cx="15.5" cy="8.5" r="1.3"/><circle cx="8.5" cy="15.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/></svg>
      <span>おまかせ</span>
    </button>
    <button id="layout-roll" type="button" class="act" aria-label="構図を変える">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M4 15h16M8 18h8"/></svg>
      <span>構図</span>
    </button>
    <button id="open-edit" type="button" class="act" aria-label="文字を編集">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
      <span>文字</span>
    </button>
    <button id="save" type="button" class="act" aria-label="画像を保存">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>
      <span>保存</span>
    </button>
  </div>
  <p class="now"><span id="layout-now"></span></p>
</main>

<!-- 文字と細かい設定 -->
<dialog id="sheet" class="sheet">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2>クレジット</h2>
      <button id="close-edit" type="button" class="close" aria-label="閉じる">完了</button>
    </div>

    <div class="field"><label for="f-title">タイトル</label><input id="f-title"><button type="button" data-roll="title" aria-label="タイトルを別の案にする" title="別の案にする">↻</button></div>
    <div class="field"><label for="f-en">サブ</label><input id="f-en"><button type="button" data-roll="en" aria-label="サブタイトルを別の案にする" title="別の案にする">↻</button></div>
    <div class="field"><label for="f-tagline">コピー</label><input id="f-tagline"><button type="button" data-roll="tagline" aria-label="コピーを別の案にする" title="別の案にする">↻</button></div>
    <div class="field"><label for="f-cast">キャスト</label><input id="f-cast" placeholder="読点で区切る"><button type="button" data-roll="cast" aria-label="キャストを別の案にする" title="別の案にする">↻</button></div>
    <div class="field"><label for="f-director">監督</label><input id="f-director"><button type="button" data-roll="director" aria-label="監督を別の案にする" title="別の案にする">↻</button></div>
    <div class="field"><label for="f-date">公開日</label><input id="f-date"><button type="button" data-roll="date" aria-label="公開日を別の案にする" title="別の案にする">↻</button></div>
    <button id="text-random" type="button" class="text-btn">文字だけ入れ替える</button>

    <h2>構図</h2>
    <select id="layout" aria-label="構図"></select>

    <h2>写真の位置</h2>
    <label class="range">左右<input id="focusX" type="range" min="0" max="100" value="50"></label>
    <label class="range">上下<input id="focusY" type="range" min="0" max="100" value="50"></label>

    <p class="fine">人名・映画祭名・媒体名はすべて架空です。</p>
  </div>
</dialog>

<div class="drop-veil" aria-hidden="true"><span>ここに写真をドロップ</span></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
